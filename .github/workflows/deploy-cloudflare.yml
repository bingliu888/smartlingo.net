name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify session, course rooms, and payment contracts
        run: node --test tests/subscription-crypto-contract.test.mjs tests/course-student-management.test.mjs tests/smartlingo-class-live-chat.test.mjs tests/clerk-provider.test.mjs tests/clerk-session-bridge.test.mjs

      - name: Validate D1 migrations
        run: npm run db:validate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Ensure private class-media bucket
        run: npx wrangler r2 bucket create smartlingo-net-class-files --config wrangler.cloudflare.jsonc || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply smartlingo-net-cutover-20260801-d1 --remote --config wrangler.cloudflare.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify every published vocabulary pronunciation guide
        shell: bash
        run: |
          result="$(npx wrangler d1 execute smartlingo-net-cutover-20260801-d1 --remote --config wrangler.cloudflare.jsonc --command "SELECT CASE WHEN COUNT(*)=48000 AND COUNT(DISTINCT target_language)=12 AND SUM(level='beginner')=12000 AND SUM(level='intermediate')=18000 AND SUM(level='advanced')=18000 AND SUM(CASE WHEN target_phonetic<>'' AND lexical_source_url<>'' AND lexical_source_license<>'' AND lexical_source_revision<>'' AND review_method<>'' AND json_extract(pronunciation_guides,'$.zh')<>'' AND json_extract(pronunciation_guides,'$.en')<>'' AND json_extract(pronunciation_guides,'$.es')<>'' AND json_extract(pronunciation_guides,'$.ja')<>'' AND json_extract(pronunciation_guides,'$.ko')<>'' AND json_extract(pronunciation_guides,'$.fr')<>'' AND json_extract(pronunciation_guides,'$.de')<>'' AND json_extract(pronunciation_guides,'$.ru')<>'' AND json_extract(pronunciation_guides,'$.it')<>'' AND json_extract(pronunciation_guides,'$.pt')<>'' AND json_extract(pronunciation_guides,'$.ar')<>'' AND json_extract(pronunciation_guides,'$.hi')<>'' THEN 1 ELSE 0 END)=COUNT(*) AND (SELECT meaning_zh FROM smartlingo_vocabulary_items WHERE target_language='en' AND form='in')='在……里面；在……期间' AND (SELECT meaning_zh FROM smartlingo_vocabulary_items WHERE target_language='en' AND form='be')='是；存在；成为' AND (SELECT meaning_zh FROM smartlingo_vocabulary_items WHERE target_language='en' AND form='day')='一天；白天' THEN 'VOCAB_PRONUNCIATION_COMPLETE' ELSE 'VOCAB_PRONUNCIATION_INCOMPLETE' END AS verification FROM smartlingo_vocabulary_items WHERE review_status='published';")"
          grep -F 'VOCAB_PRONUNCIATION_COMPLETE' <<<"$result"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build
        run: npm run build

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.cloudflare.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure classroom runtime secret
        shell: bash
        run: |
          if [[ -z "$REALTIMEKIT_API_TOKEN" ]]; then
            echo "Dedicated RealtimeKit token is not configured; preserving the existing Worker secret."
            exit 0
          fi
          printf '%s' "$REALTIMEKIT_API_TOKEN" | npx wrangler secret put CLOUDFLARE_REALTIME_API_TOKEN --config wrangler.cloudflare.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REALTIMEKIT_API_TOKEN: ${{ secrets.CLOUDFLARE_REALTIME_API_TOKEN }}

      - name: Verify production course and payment boundaries
        shell: bash
        run: |
          home="$(curl --retry 8 --retry-delay 5 --retry-all-errors -fsS https://smartlingo.net/en)"
          grep -F 'Beginner' <<<"$home"
          if grep -F '/en/pricing' <<<"$home"; then exit 1; fi
          pricing_code="$(curl -sS -o /tmp/pricing-redirect.html -w '%{http_code}' https://smartlingo.net/en/pricing)"
          test "$pricing_code" = "307"
          status="$(curl --retry 8 --retry-delay 5 --retry-all-errors -fsS https://smartlingo.net/api/billing/status)"
          grep -F '"cryptoSettings"' <<<"$status"
          card_code="$(curl -sS -o /tmp/card-checkout.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{"classId":"course_en_basic","lang":"en"}' https://smartlingo.net/api/billing/card/checkout)"
          test "$card_code" = "401"
          code="$(curl -sS -o /tmp/admin-crypto.json -w '%{http_code}' https://smartlingo.net/api/admin/crypto-settings)"
          test "$code" = "403"
          presets_code="$(curl -sS -o /tmp/admin-crypto-presets.json -w '%{http_code}' -X POST https://smartlingo.net/api/admin/crypto-settings/presets)"
          test "$presets_code" = "403"
          students_code="$(curl -sS -o /tmp/course-students.json -w '%{http_code}' https://smartlingo.net/api/classes/course_en_basic/students)"
          test "$students_code" = "401"
          wallet_asset_code="$(curl -sS -o /dev/null -w '%{http_code}' https://smartlingo.net/wallet-assets/greatlove-onboard.js)"
          test "$wallet_asset_code" = "200"

      - name: Publish exact Project release record
        shell: bash
        run: |
          node scripts/deployment-report-sql.mjs > /tmp/smartlingo-release.sql
          npx wrangler d1 execute smartlingo-net-cutover-20260801-d1 --remote --config wrangler.cloudflare.jsonc --file /tmp/smartlingo-release.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_TITLE: Complete twelve-language vocabulary and five-turn pronunciation
          RELEASE_TITLE_ZH: 完成十二语分级词库与五轮跟读
          RELEASE_NOTES: Publish exactly 1,000 Beginner, 1,500 Intermediate, and 1,500 Advanced items for every target language|Record standard target phonetics, all twelve interface-language reading aids, source URL, license, revision, and truthful review method on every published row|Rank English homographs by WordNet corpus frequency and explicitly cover grammatical words so IN, Be, and other abbreviations cannot replace everyday meanings|Use a light library payload while keeping complete options and pronunciation aids on the ten-card daily deck|Run five automatic listen-speak-score turns after each vocabulary answer and show round scores plus the average|Require production D1 to verify all 48,000 published rows before deploying the Worker
          RELEASE_NOTES_ZH: 为每种目标语言发布精确的 1,000 条 Beginner、1,500 条 Intermediate 和 1,500 条 Advanced 词汇|每条发布数据保存目标语言标准音标、十二种界面语言助读、来源网址、许可、版本和真实审核方式|英语同形词按 WordNet 语料频次选择常用义，并显式覆盖语法词，防止 IN、Be 等缩写或符号取代日常词义|词库列表使用轻量数据载荷，每日十张卡仍保留完整选项与助读|每次词汇答题后自动完成五轮听、说、评分，并显示每轮分数与平均分|Worker 部署前必须验证生产 D1 的 48,000 条发布数据全部完整
