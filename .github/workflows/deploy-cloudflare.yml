name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify session, course rooms, and payment contracts
        run: node --test tests/subscription-crypto-contract.test.mjs tests/course-student-management.test.mjs tests/smartlingo-class-live-chat.test.mjs tests/clerk-provider.test.mjs tests/clerk-session-bridge.test.mjs

      - name: Validate D1 migrations
        run: npm run db:validate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Ensure private class-media bucket
        run: npx wrangler r2 bucket create smartlingo-net-class-files --config wrangler.cloudflare.jsonc || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply smartlingo-net-cutover-20260801-d1 --remote --config wrangler.cloudflare.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build
        run: npm run build

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.cloudflare.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure classroom runtime secret
        shell: bash
        run: |
          if [[ -z "$REALTIMEKIT_API_TOKEN" ]]; then
            echo "Dedicated RealtimeKit token is not configured; preserving the existing Worker secret."
            exit 0
          fi
          printf '%s' "$REALTIMEKIT_API_TOKEN" | npx wrangler secret put CLOUDFLARE_REALTIME_API_TOKEN --config wrangler.cloudflare.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REALTIMEKIT_API_TOKEN: ${{ secrets.CLOUDFLARE_REALTIME_API_TOKEN }}

      - name: Verify production course and payment boundaries
        shell: bash
        run: |
          home="$(curl --retry 8 --retry-delay 5 --retry-all-errors -fsS https://smartlingo.net/en)"
          grep -F 'Beginner' <<<"$home"
          if grep -F '/en/pricing' <<<"$home"; then exit 1; fi
          pricing_code="$(curl -sS -o /tmp/pricing-redirect.html -w '%{http_code}' https://smartlingo.net/en/pricing)"
          test "$pricing_code" = "307"
          status="$(curl --retry 8 --retry-delay 5 --retry-all-errors -fsS https://smartlingo.net/api/billing/status)"
          grep -F '"cryptoSettings"' <<<"$status"
          card_code="$(curl -sS -o /tmp/card-checkout.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{"classId":"course_en_basic","lang":"en"}' https://smartlingo.net/api/billing/card/checkout)"
          test "$card_code" = "401"
          code="$(curl -sS -o /tmp/admin-crypto.json -w '%{http_code}' https://smartlingo.net/api/admin/crypto-settings)"
          test "$code" = "403"
          presets_code="$(curl -sS -o /tmp/admin-crypto-presets.json -w '%{http_code}' -X POST https://smartlingo.net/api/admin/crypto-settings/presets)"
          test "$presets_code" = "403"
          students_code="$(curl -sS -o /tmp/course-students.json -w '%{http_code}' https://smartlingo.net/api/classes/course_en_basic/students)"
          test "$students_code" = "401"
          wallet_asset_code="$(curl -sS -o /dev/null -w '%{http_code}' https://smartlingo.net/wallet-assets/greatlove-onboard.js)"
          test "$wallet_asset_code" = "200"

      - name: Publish exact Project release record
        shell: bash
        run: |
          node scripts/deployment-report-sql.mjs > /tmp/smartlingo-release.sql
          npx wrangler d1 execute smartlingo-net-cutover-20260801-d1 --remote --config wrangler.cloudflare.jsonc --file /tmp/smartlingo-release.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_TITLE: 21-day SmartCard vocabulary memory and growth reports
          RELEASE_TITLE_ZH: 21 天智慧卡词汇记忆与成长报告
          RELEASE_NOTES: Add a database-backed daily SmartCard practice that prioritizes due reviews and introduces at most four new published words|Require successful retrieval on days 1, 3, 7, 14 and 21 across at least three modes before permanent mastery|Add attractive Mastered, Learning and Not started tabs with real published totals, five-star progress and daily snapshots|Keep target-language phonetics and the learner-interface pronunciation guide visible during follow-me practice
          RELEASE_NOTES_ZH: 新增数据库驱动的每日智慧卡练习，优先安排到期复习且每天最多加入四个已发布新词|只有在第 1、3、7、14、21 天完成跨日回忆并覆盖至少三种题型后才标记永久掌握|新增学会了、正在学、还未学三类词汇页，并按真实发布词量展示五星进度与每日报告|跟读练习继续显示目标语言音标和符合学习者界面语言的发音助读
