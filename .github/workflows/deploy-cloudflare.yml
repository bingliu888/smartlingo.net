name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify session, course rooms, and payment contracts
        run: node --test tests/subscription-crypto-contract.test.mjs tests/smartlingo-class-live-chat.test.mjs tests/clerk-provider.test.mjs tests/clerk-session-bridge.test.mjs

      - name: Validate D1 migrations
        run: npm run db:validate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Ensure private class-media bucket
        run: npx wrangler r2 bucket create smartlingo-net-class-files --config wrangler.cloudflare.jsonc || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply smartlingo-net-cutover-20260801-d1 --remote --config wrangler.cloudflare.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build
        run: npm run build

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.cloudflare.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure classroom runtime secret
        shell: bash
        run: |
          if [[ -z "$REALTIMEKIT_API_TOKEN" ]]; then
            echo "Dedicated RealtimeKit token is not configured; preserving the existing Worker secret."
            exit 0
          fi
          printf '%s' "$REALTIMEKIT_API_TOKEN" | npx wrangler secret put CLOUDFLARE_REALTIME_API_TOKEN --config wrangler.cloudflare.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REALTIMEKIT_API_TOKEN: ${{ secrets.CLOUDFLARE_REALTIME_API_TOKEN }}

      - name: Verify production course and payment boundaries
        shell: bash
        run: |
          home="$(curl --retry 8 --retry-delay 5 --retry-all-errors -fsS https://smartlingo.net/en)"
          grep -F 'Beginner' <<<"$home"
          if grep -F '/en/pricing' <<<"$home"; then exit 1; fi
          pricing_code="$(curl -sS -o /tmp/pricing-redirect.html -w '%{http_code}' https://smartlingo.net/en/pricing)"
          test "$pricing_code" = "307"
          status="$(curl --retry 8 --retry-delay 5 --retry-all-errors -fsS https://smartlingo.net/api/billing/status)"
          grep -F '"cryptoSettings"' <<<"$status"
          card_code="$(curl -sS -o /tmp/card-checkout.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{"classId":"course_en_basic","lang":"en"}' https://smartlingo.net/api/billing/card/checkout)"
          test "$card_code" = "401"
          code="$(curl -sS -o /tmp/admin-crypto.json -w '%{http_code}' https://smartlingo.net/api/admin/crypto-settings)"
          test "$code" = "403"
          presets_code="$(curl -sS -o /tmp/admin-crypto-presets.json -w '%{http_code}' -X POST https://smartlingo.net/api/admin/crypto-settings/presets)"
          test "$presets_code" = "403"

      - name: Publish exact Project release record
        shell: bash
        run: |
          node scripts/deployment-report-sql.mjs > /tmp/smartlingo-release.sql
          npx wrangler d1 execute smartlingo-net-cutover-20260801-d1 --remote --config wrangler.cloudflare.jsonc --file /tmp/smartlingo-release.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_TITLE: Course-scoped crypto payment configuration
          RELEASE_TITLE_ZH: 单门课程加密支付配置
          RELEASE_NOTES: Add an administrator action to create the nine standard Ethereum, BSC, Polygon, Base and GLC payment rails|Use the public receiver wallet saved in the permanent administrator profile|Keep Beginner, Intermediate and Advanced prices fixed at $20, $100 and $300 across every language|Activate only the exact selected language course after verified card or crypto payment|Never promote a member-level subscription from a course payment; all accounts remain free to register
          RELEASE_NOTES_ZH: 新增管理员操作，一键创建 Ethereum、BSC、Polygon、Base 与 GLC 共九项标准收款通道|使用永久管理员资料中保存的公开收款钱包|所有语言的初期、中级和高级课程价格固定为 20、100 和 300 美元|信用卡或加密付款验证后只启用所选语言的对应单门课程|课程付款不再提升会员级订阅，所有账户均可免费注册
