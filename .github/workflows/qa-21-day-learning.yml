name: SmartLingo 21-day learning QA

on:
  schedule:
    # 03:00 America/Los_Angeles is 10:00 UTC throughout this fixed Aug-Sep PDT run.
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      local_date:
        description: Optional Pacific date (YYYY-MM-DD) for an idempotent rerun
        required: false
        type: string

concurrency:
  group: smartlingo-21-day-learning-qa
  cancel-in-progress: false

jobs:
  daily-learning:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Resolve the Pacific learning date
        id: date
        shell: bash
        env:
          REQUESTED_DATE: ${{ inputs.local_date }}
        run: |
          local_date="${REQUESTED_DATE:-$(TZ=America/Los_Angeles date +%F)}"
          if [[ ! "$local_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid local date: $local_date" >&2
            exit 1
          fi
          if [[ "$local_date" < "2026-08-21" || "$local_date" > "2026-09-10" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "The fixed 21-day QA window is inactive on $local_date."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "local_date=$local_date" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out source
        if: steps.date.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.date.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.date.outputs.run == 'true'
        run: npm ci

      - name: Verify the QA contract
        if: steps.date.outputs.run == 'true'
        run: node --test tests/qa-21-day-learning.test.mjs

      - name: Ensure QA schema and accounts exist
        if: steps.date.outputs.run == 'true'
        run: npx wrangler d1 migrations apply smartlingo-net-cutover-20260801-d1 --remote --config wrangler.cloudflare.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Test production pages and compose daily learning log
        if: steps.date.outputs.run == 'true'
        run: node scripts/run-qa-21-day-learning.mjs > /tmp/smartlingo-qa-learning.sql
        env:
          QA_LOCAL_DATE: ${{ steps.date.outputs.local_date }}
          QA_BASE_URL: https://smartlingo.net

      - name: Commit idempotent daily learning evidence
        if: steps.date.outputs.run == 'true'
        run: npx wrangler d1 execute smartlingo-net-cutover-20260801-d1 --remote --config wrangler.cloudflare.jsonc --file /tmp/smartlingo-qa-learning.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify two users, eight language runs, and forty skill logs
        if: steps.date.outputs.run == 'true'
        shell: bash
        run: |
          result="$(npx wrangler d1 execute smartlingo-net-cutover-20260801-d1 --remote --config wrangler.cloudflare.jsonc --command "SELECT CASE WHEN COUNT(DISTINCT r.user_id)=2 AND COUNT(DISTINCT r.id)=8 AND COUNT(i.id)=40 AND SUM(i.passed)=40 AND MIN(r.status)='passed' THEN 'QA_DAY_COMPLETE' ELSE 'QA_DAY_INCOMPLETE' END AS verification FROM smartlingo_qa_learning_runs r JOIN smartlingo_qa_learning_log_items i ON i.run_id=r.id WHERE r.local_date='${{ steps.date.outputs.local_date }}';")"
          grep -F 'QA_DAY_COMPLETE' <<<"$result"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
