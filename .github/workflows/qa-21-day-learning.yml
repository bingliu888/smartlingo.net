name: SmartLingo 21-day route preflight

on:
  schedule:
    # 03:00 America/Los_Angeles is 10:00 UTC throughout this fixed Aug-Sep PDT run.
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      local_date:
        description: Optional Pacific date (YYYY-MM-DD) for an idempotent rerun
        required: false
        type: string

concurrency:
  group: smartlingo-21-day-route-preflight
  cancel-in-progress: false

jobs:
  production-route-preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Resolve the Pacific learning date
        id: date
        shell: bash
        env:
          REQUESTED_DATE: ${{ inputs.local_date }}
        run: |
          local_date="${REQUESTED_DATE:-$(TZ=America/Los_Angeles date +%F)}"
          if [[ ! "$local_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid local date: $local_date" >&2
            exit 1
          fi
          if [[ "$local_date" < "2026-08-21" || "$local_date" > "2026-09-10" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "The fixed 21-day QA window is inactive on $local_date."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "local_date=$local_date" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out source
        if: steps.date.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.date.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.date.outputs.run == 'true'
        run: npm ci

      - name: Verify the QA contract
        if: steps.date.outputs.run == 'true'
        run: node --test tests/qa-21-day-learning.test.mjs

      - name: Check all learning-feature production routes
        if: steps.date.outputs.run == 'true'
        run: node scripts/run-qa-21-day-learning.mjs | tee smartlingo-qa-route-preflight.json
        env:
          QA_LOCAL_DATE: ${{ steps.date.outputs.local_date }}
          QA_BASE_URL: https://smartlingo.net

      - name: Upload route-only preflight evidence
        if: always() && steps.date.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: smartlingo-route-preflight-${{ steps.date.outputs.local_date }}
          path: smartlingo-qa-route-preflight.json
          if-no-files-found: error
          retention-days: 21

      - name: Explain the real-account boundary
        if: steps.date.outputs.run == 'true'
        run: |
          echo "This workflow proves anonymous production route availability only."
          echo "The 03:00 Pacific local Codex task must use Gmail plus Chrome to sign in the real QA account and exercise Dashboard, Course, Today's Sprint, SmartCard Practice, SmartCard Challenge, Everyday Speaking, Score History, and Rankings."
          echo "Never publish a passed learning report from this preflight artifact."
